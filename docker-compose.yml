# One-command local stack:  docker compose up --build
#   Dashboard + API : http://localhost:3001
#   Demo target app : http://localhost:3000  (from inside the runner use http://mock-app:3000)
#
# Optional: put GHOSTIQ_LLM_API_KEY=... in a .env file next to this file to use a real model;
# without it the server runs in clearly labelled demo mode.

services:
  server:
    build:
      context: .
      target: server
    image: ghostiq/server:dev
    ports:
      # Localhost only: this single-user stack runs without sign-in (GHOSTIQ_AUTH=off).
      # To expose it, set GHOSTIQ_AUTH=on with GHOSTIQ_ADMIN_TOKEN (see docs/SECURITY.md).
      - '127.0.0.1:3001:3001'
    environment:
      GHOSTIQ_AUTH: ${GHOSTIQ_AUTH:-off}
      GHOSTIQ_ADMIN_TOKEN: ${GHOSTIQ_ADMIN_TOKEN:-}
      # The runner reaches the demo app by its service name (a private address).
      GHOSTIQ_ALLOWED_TARGETS: mock-app
      # Empty values mean "not set": no key => demo mode, Gemini key => Gemini.
      GHOSTIQ_LLM_PROVIDER: ${GHOSTIQ_LLM_PROVIDER:-}
      GHOSTIQ_LLM_MODEL: ${GHOSTIQ_LLM_MODEL:-}
      GHOSTIQ_LLM_API_KEY: ${GHOSTIQ_LLM_API_KEY:-}
      GHOSTIQ_LLM_FALLBACK: ${GHOSTIQ_LLM_FALLBACK:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ghostiq-data:/data
    restart: unless-stopped

  runner:
    build:
      context: .
      target: runner
    image: ghostiq/runner:dev
    environment:
      GHOSTIQ_SERVER_URL: http://server:3001
      GHOSTIQ_PROJECT_ID: ${GHOSTIQ_PROJECT_ID:-local-app-test-project-id}
      # Required when the server has GHOSTIQ_AUTH=on (create one in the dashboard).
      GHOSTIQ_API_KEY: ${GHOSTIQ_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy
    ipc: host # recommended by Playwright for Chromium stability
    restart: unless-stopped

  mock-app:
    build:
      context: .
      target: mock-app
    image: ghostiq/mock-app:dev
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

volumes:
  ghostiq-data:
