# Keyboard-only User: everything must be reachable and operable without a mouse.
# Finds missing focus styles, focus traps, unreachable controls and bad tab order.
id: keyboard-only
name: Keyboard-only User
description: Uses only the keyboard (Tab, Shift+Tab, Enter, Space, arrow keys) to complete tasks.
traits: >-
  Move focus with Tab and Shift+Tab, activate with Enter or Space, use arrow keys in menus
  and lists. Never click. If a control cannot be reached or activated with the keyboard,
  finish with goalMet=false and say which control blocked you.
goals:
  - Sign in and reach the main page using only the keyboard.
pacing: { min_ms: 200, max_ms: 600 }
input_strategy: valid
# No click or hover: the planner cannot use the mouse. Typing into a field uses fill.
allowed_actions: [press, fill, select, scroll, wait, goBack, reload]
behaviors:
  - { type: tab_hopping, probability: 0.30, repeat: 3 }
device: laptop
network: none
risk_tolerance: normal
seed: 42
