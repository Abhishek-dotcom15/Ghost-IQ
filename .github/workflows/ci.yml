name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  smoke:
    name: End-to-end smoke (demo mode)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @ghostiq/runner exec playwright install --with-deps chromium
      - run: pnpm db:setup
      - name: Run stack and one exploration session
        run: node scripts/smoke.mjs
      - name: CLI end to end (run, gates and exit codes, export, replay, issues, MCP)
        run: node scripts/cli-e2e.mjs
      - name: Oracle regression guard (seeded-bug benchmark, one persona)
        run: node scripts/bench-bugs.mjs --personas happy-path --no-visual --steps 80 --min-recall 0.6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: evals/results/
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target: [server, runner, mock-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
